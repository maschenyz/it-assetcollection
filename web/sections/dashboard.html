<!-- VIEW: DASHBOARD OVERVIEW -->
<section x-show="view==='dashboard'" x-cloak x-data="dashboardPageData" x-init="initDashboard()">

    <!-- TOP KPI -->
    <div class="stats-row stats-row-6 mb-4">
        <!-- TOTAL COMPUTERS -->
        <div class="stat-card kpi red" @click="resetFilters()" style="cursor: pointer;">
            <div class="stat-body">
                <div class="stat-value" x-text="stats.computers"></div>
                <div class="stat-label">คอมพิวเตอร์ทั้งหมด</div>
            </div>
            <div class="stat-icon">🖥️</div>
        </div>

        <!-- ONLINE -->
        <div class="stat-card kpi green" @click="setFilter('status', 'ONLINE')" style="cursor: pointer;">
            <div class="stat-body">
                <div class="stat-value" x-text="statusStats.find(x => x.name.includes('Online'))?.count || 0"></div>
                <div class="stat-label">ออนไลน์วันนี้</div>
            </div>
            <div class="stat-icon">🟢</div>
        </div>

        <!-- OFFLINE -->
        <div class="stat-card kpi gray" @click="setFilter('status', 'OFFLINE')" style="cursor: pointer;">
            <div class="stat-body">
                <div class="stat-value" x-text="statusStats.find(x => x.name.includes('Offline'))?.count || 0"></div>
                <div class="stat-label">ออฟไลน์วันนี้</div>
            </div>
            <div class="stat-icon">🔴</div>
        </div>

        <!-- OVERTIME ALERT -->
        <div class="stat-card kpi orange" 
             @click="stats.overtime_count > 0 ? setFilter('dept', stats.overtime_dept) : null" 
             style="cursor: pointer;"
             :style="stats.overtime_count > 0 ? 'border: 2px solid var(--accent-orange);' : ''">
            <div class="stat-body">
                <div class="stat-value" x-text="stats.overtime_count || 0"></div>
                <div class="stat-label" x-text="stats.overtime_count > 0 ? 'เปิดค้าง >2 วัน (' + stats.overtime_dept + ')' : 'ไม่มีเครื่องเปิดค้าง >2 วัน'"></div>
            </div>
            <div class="stat-icon">⚠️</div>
        </div>

        <div class="stat-card kpi blue" @click="switchView('printers')" style="cursor: pointer;">
            <div class="stat-body">
                <div class="stat-value" x-text="stats.printers"></div>
                <div class="stat-label">ปริ้นเตอร์</div>
            </div>
            <div class="stat-icon">🖨️</div>
        </div>

        <div class="stat-card kpi lime" @click="switchView('software')" style="cursor: pointer;">
            <div class="stat-body">
                <div class="stat-value" x-text="stats.software"></div>
                <div class="stat-label">โปรแกรมทั้งหมด</div>
            </div>
            <div class="stat-icon">📦</div>
        </div>
    </div>

    <!-- GRID -->
    <div class="dashboard-grid">

        <!-- STATUS -->
        <div class="card dashboard-span-3">
            <div class="card-header">
                <h3 class="card-title">คอมพิวเตอร์ โดย Status</h3>
            </div>
            <div class="mini-list">
                <template x-for="item in statusStats" :key="item.name">
                    <div class="mini-row" @click="setFilter('status', item.name.includes('Online') ? 'ONLINE' : 'OFFLINE')" style="cursor: pointer;">
                        <div class="mini-left">
                            <div class="mini-badge" x-text="item.count"></div>
                            <div class="mini-name" x-text="item.name"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- MANUFACTURER -->
        <div class="card dashboard-span-3">
            <div class="card-header">
                <h3 class="card-title">คอมพิวเตอร์ โดย ผู้ผลิต</h3>
            </div>
            <div class="mini-list">
                <template x-for="item in manufacturerStats" :key="item.name">
                    <div class="mini-row" @click="setFilter('mfg', item.name)" style="cursor: pointer;">
                        <div class="mini-left">
                            <div class="mini-badge" x-text="item.count"></div>
                            <div class="mini-name" x-text="item.name"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- TYPE -->
        <div class="card dashboard-span-3">
            <div class="card-header">
                <h3 class="card-title">คอมพิวเตอร์ โดย ประเภท</h3>
            </div>
            <div class="mini-list">
                <template x-for="item in typeStats" :key="item.name">
                    <div class="mini-row" @click="setFilter('type', item.name)" style="cursor: pointer;">
                        <div class="mini-left">
                            <div class="mini-name" x-text="item.name"></div>
                        </div>
                        <div class="mini-badge" x-text="item.count"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- MONITOR BRAND -->
        <div class="card dashboard-span-3">
            <div class="card-header">
                <h3 class="card-title">จอภาพ โดย ผู้ผลิต</h3>
            </div>
            <div class="mini-list">
                <template x-for="item in monitorBrands" :key="item.name">
                    <div class="mini-row">
                        <div class="mini-left">
                            <div class="mini-badge" x-text="item.count"></div>
                            <div class="mini-name" x-text="item.name"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>

</section>
