<!-- VIEW: LOGS -->
<section x-show="view==='logs'" x-cloak>
    <div class="card mb-4">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="card-title">📜 System Audit Logs</h3>
            <button class="btn-sm btn-outline" @click="loadLogs()">🔄 Refresh Logs</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Device</th>
                        <th>Type</th>
                        <th>Field Name</th>
                        <th>Old Value</th>
                        <th>New Value</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="log in logs" :key="log.id">
                        <tr>
                            <td class="small mono" x-text="formatDate(log.date)"></td>
                            <td class="fw-bold" x-text="log.hostname || 'System'"></td>
                            <td><span class="badge usb" x-text="log.type"></span></td>
                            <td x-text="log.field"></td>
                            <td class="text-muted" x-text="log.old || '-'"></td>
                            <td class="fw-bold" x-text="log.new || '-'"></td>
                        </tr>
                    </template>
                    <tr x-show="!logs || logs.length === 0">
                        <td colspan="6" class="text-center py-4 text-muted">No audit logs recorded yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
